name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  # ── Check Commit Message ──────────────────────────────
  check:
    name: Check commit message
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.flags.outputs.should_build }}
      should_release: ${{ steps.flags.outputs.should_release }}
      should_publish: ${{ steps.flags.outputs.should_publish }}
      should_publish_pypi: ${{ steps.flags.outputs.should_publish_pypi }}
      should_publish_crates: ${{ steps.flags.outputs.should_publish_crates }}
      should_benchmark: ${{ steps.flags.outputs.should_benchmark }}
      version: ${{ steps.flags.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Parse commit message
        id: flags
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG="$COMMIT_MSG"
          
          # Extract version from go/main.go
          # Looks for: const Version = "0.0.1"
          VERSION="v$(grep 'const Version' go/main.go | awk '{print $4}' | tr -d '"')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"
          
          # Always build PRs
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "should_build=true"    >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "should_benchmark=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Init flags
          BUILD=false
          RELEASE=false
          
          # Only build action and build release
          if echo "$MSG" | grep -qi "build release"; then
            BUILD=true
            RELEASE=true
          elif echo "$MSG" | grep -qi "build action"; then
            BUILD=true
          fi
          
          echo "should_build=$BUILD"     >> "$GITHUB_OUTPUT"
          echo "should_release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "should_publish=false"    >> "$GITHUB_OUTPUT"
          echo "should_publish_pypi=false" >> "$GITHUB_OUTPUT"
          echo "should_publish_crates=false" >> "$GITHUB_OUTPUT"
          echo "should_benchmark=false"  >> "$GITHUB_OUTPUT"
          
          echo "📋 Flags: build=$BUILD release=$RELEASE publish=$PUBLISH publish_pypi=$PUBLISH_PYPI publish_crates=$PUBLISH_CRATES benchmark=$BENCHMARK"

  # ── Sync to Gitee ─────────────────────────────────────
  sync-gitee-code:
    name: 【Gitee码云】Sync Code Commit
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Mirror to Gitee
        uses: Yikun/hub-mirror-action@v1.5
        continue-on-error: true
        with:
          src: github/VincentZyuApps
          dst: gitee/vincent-zyu
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          static_list: "mc-skin-wrap-http-server"
          force_update: true
          debug: true

  # ── Build (Multi-Platform) ─────────────────────────────
  build:
    name: Build ${{ matrix.name }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - goos: windows
            goarch: amd64
            name: windows-amd64
            binary: mc-skin-wrap-go.exe
            asset: mc-skin-wrap-go-windows-amd64.exe

          # Linux x64
          - goos: linux
            goarch: amd64
            name: linux-amd64
            binary: mc-skin-wrap-go
            asset: mc-skin-wrap-go-linux-amd64

          # Windows ARM64
          - goos: windows
            goarch: arm64
            name: windows-arm64
            binary: mc-skin-wrap-go.exe
            asset: mc-skin-wrap-go-windows-arm64.exe

          # Linux ARM64
          - goos: linux
            goarch: arm64
            name: linux-arm64
            binary: mc-skin-wrap-go
            asset: mc-skin-wrap-go-linux-arm64

          # macOS x64
          - goos: darwin
            goarch: amd64
            name: macos-amd64
            binary: mc-skin-wrap-go
            asset: mc-skin-wrap-go-macos-amd64

          # macOS ARM64
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            binary: mc-skin-wrap-go
            asset: mc-skin-wrap-go-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache-dependency-path: go/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build via build.py
        run: |
          python go/build.py --os ${{ matrix.goos }} --arch ${{ matrix.goarch }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # ── Release to GitHub ──────────────────────────────────
  release:
    name: Release to GitHub
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: |
          echo "Downloaded artifacts:"
          ls -lh artifacts/

      - name: Delete existing release & tag (force fresh release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          echo "🗑️ Cleaning up existing release/tag: $VERSION"
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || echo "No existing release to delete"
          sleep 3

      - name: Generate release notes from commits
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"
          
          # 查找上一个 release tag（排除当前版本）
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -1)
          
          # 提取不带 v 前缀的版本号
          PLAIN_VER="${VERSION#v}"
          
          {
            echo "## 📦 mc-skin-wrap ${VERSION}"
            echo ""
            echo "> Minecraft 皮肤/头像/服务器状态 API 代理服务"
            echo ""
            echo "### ⬇️ Downloads (Go 二进制分发)"
            echo ""
            echo "| Platform | x86_64 (amd64) | ARM64 |"
            echo "|----------|----------------|-------|"
            echo "| **Windows** | [zip](${BASE_URL}/mc-skin-wrap_${PLAIN_VER}_windows_amd64.zip) | [zip](${BASE_URL}/mc-skin-wrap_${PLAIN_VER}_windows_arm64.zip) |"
            echo "| **Linux** | [tar.gz](${BASE_URL}/mc-skin-wrap_${PLAIN_VER}_linux_amd64.tar.gz) | [tar.gz](${BASE_URL}/mc-skin-wrap_${PLAIN_VER}_linux_arm64.tar.gz) |"
            echo "| **macOS** | [tar.gz](${BASE_URL}/mc-skin-wrap_${PLAIN_VER}_darwin_amd64.tar.gz) | [tar.gz](${BASE_URL}/mc-skin-wrap_${PLAIN_VER}_darwin_arm64.tar.gz) |"
            echo ""
            echo "### 📥 Quick Install (Linux)"
            echo ""
            echo "**One-liner install:**"
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/main/doc/scripts/install.sh | bash"
            echo '```'
            echo ""
            echo "**Install specific version:**"
            echo '```bash'
            echo "MC_SKIN_WRAP_VERSION=${VERSION} bash -c \"\$(curl -fsSL https://raw.githubusercontent.com/${REPO}/main/doc/scripts/install.sh)\""
            echo '```'
            echo ""
            echo "**🇨🇳 国内 Gitee 镜像:**"
            echo '```bash'
            echo "curl -fsSL https://gitee.com/vincent-zyu/mc-skin-wrap-http-server/raw/main/doc/scripts/install_gitee.sh | bash"
            echo '```'
            echo ""
            echo "**🇨🇳 Gitee 镜像 (指定版本):**"
            echo '```bash'
            echo "MC_SKIN_WRAP_VERSION=${VERSION} bash -c \"\$(curl -fsSL https://gitee.com/vincent-zyu/mc-skin-wrap-http-server/raw/main/doc/scripts/install_gitee.sh)\""
            echo '```'
            echo ""
            echo "> 📄 [View install script (GitHub)](https://github.com/${REPO}/blob/main/doc/scripts/install.sh)"
            echo ">"
            echo "> 📄 [View install script (Gitee)](https://gitee.com/vincent-zyu/mc-skin-wrap-http-server/blob/main/doc/scripts/install_gitee.sh)"
            echo ""
            echo "---"
            echo ""
            echo "### What's Changed"
            echo ""
          
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since **${PREV_TAG}**:"
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (\`%h\`)" --reverse
            else
              echo "All changes since repository creation:"
              echo ""
              git log --pretty=format:"- %s (\`%h\`)" --reverse
            fi
          
            echo ""
            echo ""
            echo "---"
            echo ""
            echo "### 📊 Build Info"
            echo "- **Build date**: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- **Commit**: [\`${GITHUB_SHA::7}\`](https://github.com/${REPO}/commit/${GITHUB_SHA})"
            echo ""
            
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${VERSION}"
            else
              echo "**Full Changelog**: https://github.com/${REPO}/commits/${VERSION}"
            fi
          } > release_notes.md
          
          echo "📝 Generated release notes:"
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          gh release create "$VERSION" \
            --title "mc-skin-wrap ${VERSION}" \
            --notes-file release_notes.md \
            --latest \
            artifacts/*

  # ── Sync Release to Gitee ─────────────────────────────
  sync-gitee-release:
    name: 【Gitee码云】Sync Release
    needs: [check, release]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: vincent-zyu
      GITEE_REPO: mc-skin-wrap-http-server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get release info from GitHub
        id: release_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.check.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          RELEASE_INFO=$(gh release view "$TAG" --json name,body,assets)
          echo "release_name=$(echo "$RELEASE_INFO" | jq -r '.name')" >> "$GITHUB_OUTPUT"
          echo "$RELEASE_INFO" | jq -r '.body' > release_body.md

          echo "📦 Release: $TAG"
          echo "📝 Assets:"
          echo "$RELEASE_INFO" | jq -r '.assets[].name'

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          mkdir -p assets
          cd assets
          gh release download "$TAG" --pattern "*"
          echo "📥 Downloaded files:"
          ls -la

      - name: Create or find Gitee Release
        id: gitee_release
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          NAME="${{ steps.release_info.outputs.release_name }}"

          # JSON 安全转义 release body
          JSON_BODY=$(jq -R -s '.' < release_body.md)

          # 1. 确保 tag 存在于 Gitee
          if curl -s --fail "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/tags/${TAG}?access_token=${GITEE_TOKEN}" > /dev/null 2>&1; then
            echo "🏷️ Tag $TAG already exists on Gitee"
          else
            echo "🏷️ Creating tag $TAG on Gitee..."
            curl -s -X POST --header 'Content-Type: application/json;charset=UTF-8' \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/tags" \
              -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG}\",\"refs\":\"main\",\"tag_message\":\"Release ${TAG}\"}"
          fi

          # 2. 检查是否已有对应 tag 的 Release
          EXISTING=$(curl -s "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}")
          RELEASE_ID=$(echo "$EXISTING" | jq -r '.id')

          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            ASSET_COUNT=$(echo "$EXISTING" | jq '.assets | length')
            echo "⚠️ Gitee release already exists (ID: $RELEASE_ID, assets: $ASSET_COUNT)"
          else
            echo "✅ No existing release, creating..."

            RELEASE_PAYLOAD=$(jq -n \
              --arg token "$GITEE_TOKEN" \
              --arg tag "$TAG" \
              --arg name "$NAME" \
              --argjson body "$JSON_BODY" \
              '{
                access_token: $token,
                tag_name: $tag,
                name: $name,
                body: $body,
                target_commitish: "main",
                prerelease: false
              }')

            CREATE_RESPONSE=$(curl -s -X POST --header 'Content-Type: application/json;charset=UTF-8' \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
              -d "$RELEASE_PAYLOAD")

            RELEASE_ID=$(echo "$CREATE_RESPONSE" | jq -r '.id')
            ASSET_COUNT=0

            if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
              echo "❌ Failed to create Gitee release"
              echo "Response: $CREATE_RESPONSE"
              exit 1
            fi
            echo "✅ Created Gitee release (ID: $RELEASE_ID)"
          fi

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "asset_count=$ASSET_COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload assets to Gitee
        if: steps.gitee_release.outputs.release_id != '' && steps.gitee_release.outputs.release_id != 'null'
        run: |
          RELEASE_ID="${{ steps.gitee_release.outputs.release_id }}"

          ts() {
            echo "[$(date -u '+%H:%M:%S UTC') / $(TZ='Asia/Shanghai' date '+%H:%M:%S CST')]"
          }

          echo "$(ts) 📤 Uploading assets to Gitee release (ID: $RELEASE_ID)"

          SUCCESS=0
          FAIL=0
          TOTAL=$(ls -1 assets/ | wc -l)
          CURRENT=0
          echo "$(ts) 📁 Total files to upload: $TOTAL"

          for FILE in assets/*; do
            if [ -f "$FILE" ]; then
              CURRENT=$((CURRENT + 1))
              FILENAME=$(basename "$FILE")
              FILESIZE=$(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE" 2>/dev/null)
              FILESIZE_H=$(numfmt --to=iec $FILESIZE 2>/dev/null || echo "${FILESIZE} bytes")
              echo ""
              echo "$(ts) ──── [$CURRENT/$TOTAL] $FILENAME ($FILESIZE_H) ────"

              UPLOADED=false
              for ATTEMPT in 1 2 3; do
                echo "$(ts)   🔄 Attempt $ATTEMPT/3 — starting curl (max-time=1200s, connect-timeout=30s)"

                START_TIME=$(date +%s)
                RESPONSE=$(curl -s --max-time 1200 --connect-timeout 30 \
                  -w "\n%{http_code}" \
                  -X POST --header "Content-Type: multipart/form-data" \
                  -F "access_token=${GITEE_TOKEN}" \
                  -F "file=@${FILE}" \
                  "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files")
                CURL_EXIT=$?
                END_TIME=$(date +%s)
                ELAPSED=$((END_TIME - START_TIME))

                HTTP_CODE=$(echo "$RESPONSE" | tail -1)
                BODY=$(echo "$RESPONSE" | sed '$d')

                echo "$(ts)   📡 curl exit=$CURL_EXIT, HTTP=$HTTP_CODE, took ${ELAPSED}s"

                if [ $CURL_EXIT -ne 0 ]; then
                  case $CURL_EXIT in
                    28) echo "$(ts)   ⏱️ TIMEOUT: curl exceeded max-time (${ELAPSED}s)" ;;
                    7)  echo "$(ts)   🔌 CONNECTION REFUSED: Gitee server unreachable" ;;
                    56) echo "$(ts)   💥 RECV ERROR: connection reset during transfer" ;;
                    *)  echo "$(ts)   ❓ CURL ERROR $CURL_EXIT" ;;
                  esac
                elif echo "$BODY" | jq -e '.browser_download_url' > /dev/null 2>&1; then
                  URL=$(echo "$BODY" | jq -r '.browser_download_url')
                  echo "$(ts)   ✅ SUCCESS: $URL"
                  SUCCESS=$((SUCCESS + 1))
                  UPLOADED=true
                  break
                else
                  echo "$(ts)   ⚠️ UNEXPECTED RESPONSE (HTTP $HTTP_CODE):"
                  echo "$(ts)   $(echo "$BODY" | head -c 300)"
                fi

                if [ $ATTEMPT -lt 3 ]; then
                  echo "$(ts)   💤 Waiting 10s before retry..."
                  sleep 10
                fi
              done

              if [ "$UPLOADED" = false ]; then
                echo "$(ts)   ❌ GAVE UP on $FILENAME after 3 attempts"
                FAIL=$((FAIL + 1))
              fi
            fi
          done

          echo ""
          echo "$(ts) ════════════════════════════════════════"
          echo "$(ts) 📊 Upload summary: $SUCCESS/$TOTAL succeeded, $FAIL failed"
          echo "$(ts) ════════════════════════════════════════"
